<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>graphify 3D — ChopChopMol 2.0</title>
<script src="https://unpkg.com/3d-force-graph@1.73.4/dist/3d-force-graph.min.js"
        integrity="sha384-GNPicn8pBA2/PGSyPTpxIlPurgLUYcNYJ2zskIq782dE9+gp5E32WSyuxZqA7J+u"
        crossorigin="anonymous"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg0: #05060d;
    --panel: rgba(14, 16, 30, 0.82);
    --panel-solid: #0e1020;
    --border: rgba(120, 140, 220, 0.18);
    --text: #dfe4f5;
    --dim: #8790ad;
    --accent: #5eead4;
  }
  html, body { height: 100%; }
  body {
    background: var(--bg0);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif;
    overflow: hidden;
  }

  /* ---- deep-space backdrop behind the transparent WebGL canvas ---- */
  #space {
    position: fixed; inset: 0; z-index: 0;
    background:
      radial-gradient(ellipse 70% 55% at 50% 45%, rgba(56, 78, 160, 0.20) 0%, rgba(0,0,0,0) 70%),
      radial-gradient(ellipse 45% 40% at 78% 22%, rgba(160, 60, 150, 0.13) 0%, rgba(0,0,0,0) 70%),
      radial-gradient(ellipse 50% 45% at 18% 80%, rgba(30, 150, 160, 0.11) 0%, rgba(0,0,0,0) 70%),
      var(--bg0);
  }
  #stars { position: fixed; inset: 0; z-index: 1; pointer-events: none; opacity: 0.75; }
  #graph  { position: fixed; inset: 0; z-index: 2; }
  #vignette {
    position: fixed; inset: 0; z-index: 3; pointer-events: none;
    background: radial-gradient(ellipse 75% 75% at 50% 50%, rgba(0,0,0,0) 55%, rgba(0,0,0,0.55) 100%);
  }

  /* ---- floating labels drawn over the canvas ---- */
  #labels { position: fixed; inset: 0; z-index: 4; pointer-events: none; }
  .lbl {
    position: absolute; transform: translate(-50%, -50%);
    font-size: 10.5px; letter-spacing: 0.02em; white-space: nowrap;
    color: #eef1fb; text-shadow: 0 0 6px #000, 0 0 12px #000, 0 1px 2px #000;
    padding: 1px 5px; border-radius: 5px;
    background: rgba(5, 6, 13, 0.45);
    border: 1px solid rgba(255,255,255,0.06);
    will-change: transform, opacity;
  }
  .lbl.hub { font-weight: 600; font-size: 11.5px; }

  /* ---- chrome ---- */
  .panel {
    position: fixed; z-index: 6;
    background: var(--panel);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border: 1px solid var(--border);
    border-radius: 12px;
    box-shadow: 0 12px 40px rgba(0,0,0,0.55);
  }

  #hud { top: 14px; left: 14px; width: 268px; padding: 12px 13px; }
  #hud h1 {
    font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--accent); font-weight: 600; margin-bottom: 2px;
  }
  #hud .sub { font-size: 11px; color: var(--dim); margin-bottom: 10px; }
  #stats { display: flex; gap: 14px; font-size: 11px; color: var(--dim); margin-bottom: 10px; }
  #stats b { color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; }

  #search {
    width: 100%; background: rgba(0,0,0,0.35); border: 1px solid var(--border);
    color: var(--text); padding: 7px 9px; border-radius: 8px; font-size: 12px; outline: none;
  }
  #search:focus { border-color: var(--accent); }
  #results { margin-top: 6px; max-height: 168px; overflow-y: auto; display: none; }
  .hit {
    padding: 5px 7px; border-radius: 6px; font-size: 11.5px; cursor: pointer;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    display: flex; align-items: center; gap: 7px;
  }
  .hit:hover { background: rgba(94, 234, 212, 0.10); }
  .hit .dot { width: 7px; height: 7px; border-radius: 50%; flex: none; }
  .hit .meta { color: var(--dim); font-size: 10px; margin-left: auto; flex: none; }

  .ctl { margin-top: 11px; }
  .ctl label { display: block; font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--dim); margin-bottom: 5px; }
  .seg { display: flex; gap: 3px; background: rgba(0,0,0,0.32); padding: 3px; border-radius: 8px; }
  .seg button {
    flex: 1; background: none; border: none; color: var(--dim); font-size: 11px;
    padding: 5px 4px; border-radius: 6px; cursor: pointer; font-family: inherit;
  }
  .seg button:hover { color: var(--text); }
  .seg button.on { background: rgba(94, 234, 212, 0.14); color: var(--accent); }

  .checks { display: flex; flex-direction: column; gap: 5px; }
  .checks label {
    display: flex; align-items: center; gap: 7px; font-size: 11.5px;
    color: var(--text); text-transform: none; letter-spacing: 0; cursor: pointer; margin: 0;
  }
  .checks input { accent-color: var(--accent); cursor: pointer; }

  #buttons { display: flex; gap: 6px; margin-top: 11px; }
  #buttons button {
    flex: 1; background: rgba(0,0,0,0.32); border: 1px solid var(--border);
    color: var(--text); font-size: 11px; padding: 6px; border-radius: 7px;
    cursor: pointer; font-family: inherit;
  }
  #buttons button:hover { border-color: var(--accent); color: var(--accent); }

  /* ---- legend ---- */
  #legend { top: 14px; right: 14px; width: 246px; max-height: calc(100vh - 28px); display: flex; flex-direction: column; }
  #legend header {
    padding: 11px 13px 9px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
  }
  #legend header span { font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--dim); }
  #legend header button {
    background: none; border: none; color: var(--accent); font-size: 10.5px; cursor: pointer; font-family: inherit;
  }
  #legend-body { overflow-y: auto; padding: 6px; }
  .leg {
    display: flex; align-items: center; gap: 8px; padding: 4px 6px;
    border-radius: 6px; cursor: pointer; font-size: 11.5px;
  }
  .leg:hover { background: rgba(255,255,255,0.05); }
  .leg.off { opacity: 0.3; }
  .leg .swatch { width: 9px; height: 9px; border-radius: 50%; flex: none; box-shadow: 0 0 7px currentColor; }
  .leg .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .leg .n { margin-left: auto; color: var(--dim); font-size: 10px; font-variant-numeric: tabular-nums; flex: none; }

  /* ---- detail drawer ---- */
  #detail {
    bottom: 14px; left: 14px; width: 340px; max-height: 42vh;
    padding: 13px; display: none; flex-direction: column;
  }
  #detail.show { display: flex; }
  #detail .close {
    position: absolute; top: 9px; right: 11px; background: none; border: none;
    color: var(--dim); font-size: 16px; cursor: pointer; line-height: 1;
  }
  #detail .close:hover { color: var(--text); }
  #d-label { font-size: 14px; font-weight: 600; padding-right: 20px; word-break: break-word; }
  #d-comm { font-size: 11px; margin-top: 3px; display: flex; align-items: center; gap: 6px; }
  #d-comm .swatch { width: 8px; height: 8px; border-radius: 50%; box-shadow: 0 0 7px currentColor; }
  #d-meta { margin-top: 10px; font-size: 11.5px; color: var(--dim); line-height: 1.65; }
  #d-meta code {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    color: var(--text); background: rgba(0,0,0,0.35); padding: 1px 4px; border-radius: 4px; font-size: 10.5px;
  }
  #d-neighbors { margin-top: 10px; overflow-y: auto; }
  #d-neighbors .nh {
    display: flex; align-items: center; gap: 7px; padding: 3px 5px;
    border-radius: 5px; font-size: 11px; cursor: pointer;
  }
  #d-neighbors .nh:hover { background: rgba(94,234,212,0.10); }
  #d-neighbors .nh .dot { width: 6px; height: 6px; border-radius: 50%; flex: none; }
  #d-neighbors .nh .rel { color: var(--dim); font-size: 9.5px; margin-left: auto; flex: none; }
  .sec { font-size: 9.5px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--dim); margin: 10px 0 4px; }

  #tip {
    position: fixed; z-index: 7; pointer-events: none; display: none;
    background: rgba(5,6,13,0.94); border: 1px solid var(--border);
    padding: 5px 9px; border-radius: 7px; font-size: 11.5px; max-width: 300px;
  }
  #tip .t2 { color: var(--dim); font-size: 10px; margin-top: 1px; }

  #hint {
    position: fixed; z-index: 5; bottom: 16px; left: 50%; transform: translateX(-50%);
    font-size: 10.5px; color: var(--dim); letter-spacing: 0.05em;
    background: rgba(5,6,13,0.6); padding: 5px 12px; border-radius: 20px;
    border: 1px solid var(--border); transition: opacity 0.6s;
  }

  ::-webkit-scrollbar { width: 7px; }
  ::-webkit-scrollbar-thumb { background: rgba(120,140,220,0.22); border-radius: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }

  @media (max-width: 900px) {
    #legend, #detail { display: none !important; }
    #hud { width: calc(100vw - 28px); }
  }
</style>
</head>
<body>
<div id="space"></div>
<canvas id="stars"></canvas>
<div id="graph"></div>
<div id="vignette"></div>
<div id="labels"></div>

<div id="hud" class="panel">
  <h1>ChopChopMol 2.0</h1>
  <div class="sub">knowledge graph · 3d force layout</div>
  <div id="stats">
    <div><b id="s-nodes">0</b> nodes</div>
    <div><b id="s-links">0</b> edges</div>
    <div><b id="s-comm">0</b> clusters</div>
  </div>

  <input id="search" type="text" placeholder="Search nodes…" autocomplete="off" spellcheck="false">
  <div id="results"></div>

  <div class="ctl">
    <label>Color by</label>
    <div class="seg" id="seg-color">
      <button data-v="community" class="on">Cluster</button>
      <button data-v="file_type">Type</button>
      <button data-v="origin">Origin</button>
    </div>
  </div>

  <div class="ctl">
    <label>Edge confidence</label>
    <div class="checks" id="conf-filters">
      <label><input type="checkbox" data-c="EXTRACTED" checked> Extracted <span style="color:#8790ad">(hard evidence)</span></label>
      <label><input type="checkbox" data-c="INFERRED" checked> Inferred</label>
      <label><input type="checkbox" data-c="AMBIGUOUS" checked> Ambiguous</label>
      <label><input type="checkbox" data-c="HYPEREDGE"> Hyperedges</label>
    </div>
  </div>

  <div class="ctl">
    <label>Labels</label>
    <div class="seg" id="seg-labels">
      <button data-v="hubs" class="on">Top 5</button>
      <button data-v="all">All</button>
      <button data-v="none">Off</button>
    </div>
  </div>

  <div id="buttons">
    <button id="btn-reheat">Reheat</button>
    <button id="btn-spin">Spin</button>
    <button id="btn-reset">Reset view</button>
  </div>
</div>

<div id="legend" class="panel">
  <header>
    <span>Clusters</span>
    <button id="leg-all">show all</button>
  </header>
  <div id="legend-body"></div>
</div>

<div id="detail" class="panel">
  <button class="close" id="d-close">&times;</button>
  <div id="d-label"></div>
  <div id="d-comm"></div>
  <div id="d-meta"></div>
  <div class="sec" id="d-nsec">Connections</div>
  <div id="d-neighbors"></div>
</div>

<div id="tip"></div>
<div id="hint">drag to orbit · scroll to zoom · hover to name · click to trace connections</div>

ence":"HYPEREDGE","confidence_score":0.85},{"source":"screenshots_torsion_scan_scan","target":"screenshots_torsion_scan_mace_mp0a","relation":"Torsion Scan to Energy Calculation to Chart Pipeline","confidence":"HYPEREDGE","confidence_score":0.85},{"source":"screenshots_torsion_scan_scan","target":"screenshots_torsion_scan_energy_curve","relation":"Torsion Scan to Energy Calculation to Chart Pipeline","confidence":"HYPEREDGE","confidence_score":0.85},{"source":"screenshots_torsion_scan_mace_mp0a","target":"screenshots_torsion_scan_energy_curve","relation":"Torsion Scan to Energy Calculation to Chart Pipeline","confidence":"HYPEREDGE","confidence_score":0.85}],"communityLabels":{"0":"Main Controller Scene Setup","1":"Local File Explorer","2":"Remote SSH File Browser","3":"Molecule Mesh Rendering","4":"Frames Scans and Parsing","5":"Chat UI and Job Polling","6":"Pointer Picking and Selection","7":"Access Gate and Billing Pages","8":"Deployment and AWS Migration","9":"Feature Gating and DOM Cache","10":"AI Agent Tools and BYOK","11":"Molecule Lifecycle and Fragments","12":"MACE and DFT Backend Calls","13":"Molecular File Parsers","14":"App Shell Screenshot","15":"Roadmap and Legal Docs","16":"Stripe Premium Subscription","17":"Atom Rotation and Translation","18":"Mobile UI Panels","19":"MACE Fine-Tuning Guide","20":"Geometry Measurement Labels","21":"Web Terminal Manager","22":"Protein Ribbon Rendering","23":"AWS Cognito Authentication","24":"Molecular File Export","25":"Chemical Database Search","26":"Atom Bond LOD Primitives","27":"Toast Notifications","28":"Atom Editing Panel Screenshot","29":"Charge and Force Coloring","30":"Orbital Isosurface Generation","31":"Style Panel Screenshot","32":"AI Chat Screenshot","33":"Undo Redo Manager","34":"Energy Chart Screenshot","35":"AI Agent Test Harness","36":"Environment Map Lighting","37":"Atom Hover Interactions","38":"Early Access Gate","39":"Measurement Overlay Screenshot","40":"Ball and Stick Screenshot","41":"Style Preferences Persistence","42":"NPM Package Config","43":"Molecular Graph Traversal","44":"Marching Cubes Worker","45":"Cognito Auth Migration","46":"DynamoDB Firestore Migration","47":"Cloud Molecule Storage","48":"ExtXYZ Serialization","49":"Session Heartbeat Tracking","50":"Onboarding Tutorial","51":"CloudFront SPA Rewrite","52":"Frontend Deploy Script","53":"EC2 Resize Script","54":"EC2 Start Script","55":"EC2 Status Script","56":"EC2 Stop Script","57":"Model Picker Thinking Toggle","58":"Signed In Indicator","59":"BYOK Key Save","60":"Voice Silence Detection","61":"Cloud Molecule Load","62":"Cloud Molecule List","63":"Model List Rendering","64":"Account Icon Update","65":"Energy Chart Button","66":"Global Error Handler"}}</script>
<script>
(function () {
  "use strict";

  const RAW = JSON.parse(document.getElementById('graph-data').textContent);
  const COMM_LABELS = RAW.communityLabels;

  // ------------------------------------------------------------------ palette
  // Golden-angle hues give 67 clusters maximally-separated colors.
  function communityColor(cid) {
    const h = (cid * 137.508) % 360;
    const s = 62 + (cid % 3) * 9;          // 62 / 71 / 80
    const l = 56 + ((cid % 5) - 2) * 3.5;  // 49 .. 63
    return `hsl(${h.toFixed(1)}, ${s}%, ${l}%)`;
  }
  const TYPE_COLORS = {
    code: '#5eead4', document: '#fbbf24', paper: '#f472b6',
    image: '#a78bfa', concept: '#60a5fa', rationale: '#fb923c'
  };
  const ORIGIN_COLORS = { ast: '#5eead4', semantic: '#f472b6' };
  const CONF_COLORS = {
    EXTRACTED: [130, 170, 255], INFERRED: [190, 130, 235],
    AMBIGUOUS: [235, 130, 130], HYPEREDGE: [250, 205, 110]
  };

  // ------------------------------------------------------------------ data
  const nodes = RAW.nodes.map(n => Object.assign({}, n));
  const byId = new Map(nodes.map(n => [n.id, n]));
  const allLinks = RAW.links.filter(l => byId.has(l.source) && byId.has(l.target));

  // adjacency for highlight + detail panel
  const adj = new Map(nodes.map(n => [n.id, []]));
  for (const l of allLinks) {
    adj.get(l.source).push({ id: l.target, rel: l.relation, conf: l.confidence });
    adj.get(l.target).push({ id: l.source, rel: l.relation, conf: l.confidence });
  }

  const maxDeg = Math.max(1, ...nodes.map(n => n.degree));
  // only the five most-connected nodes carry a permanent label
  const hubIds = new Set(
    nodes.slice().sort((a, b) => b.degree - a.degree).slice(0, 5).map(n => n.id));

  // cluster roster, largest first
  const commCounts = new Map();
  for (const n of nodes) commCounts.set(n.community, (commCounts.get(n.community) || 0) + 1);
  const commOrder = [...commCounts.entries()].sort((a, b) => b[1] - a[1]);

  // ------------------------------------------------------------------ state
  const state = {
    colorBy: 'community',
    labelMode: 'hubs',
    conf: { EXTRACTED: true, INFERRED: true, AMBIGUOUS: true, HYPEREDGE: false },
    hiddenComms: new Set(),
    hover: null,
    selected: null,
    spin: false
  };
  let hlNodes = new Set(), hlLinks = new Set();

  const nodeColor = n =>
    state.colorBy === 'community' ? communityColor(n.community)
    : state.colorBy === 'file_type' ? (TYPE_COLORS[n.file_type] || '#94a3b8')
    : (ORIGIN_COLORS[n.origin] || '#94a3b8');

  // nodes ranked by degree, so the label budget always keeps the important ones
  const nodesByDeg = nodes.slice().sort((a, b) => b.degree - a.degree);
  let visibleIds = new Set(nodes.map(n => n.id));

  function visibleData() {
    const vNodes = nodes.filter(n => !state.hiddenComms.has(n.community));
    visibleIds = new Set(vNodes.map(n => n.id));
    const vLinks = allLinks.filter(l =>
      state.conf[l.confidence] && visibleIds.has(l.source) && visibleIds.has(l.target));
    return { nodes: vNodes, links: vLinks.map(l => Object.assign({}, l)) };
  }

  // ------------------------------------------------------------------ graph
  const el = document.getElementById('graph');
  let fitted = false;

  // A handful of disconnected islands drift far past the dense core. Fitting the
  // full bounding box would shrink the interesting 93% down to a speck, so fit to
  // the core and let the stragglers sit just outside the opening frame.
  function fitView(ms) {
    const ns = Graph.graphData().nodes.filter(n => n.x != null);
    if (ns.length < 3) return;
    const c = ns.reduce((a, n) => (a.x += n.x, a.y += n.y, a.z += n.z, a), { x: 0, y: 0, z: 0 });
    c.x /= ns.length; c.y /= ns.length; c.z /= ns.length;
    const r = n => Math.hypot(n.x - c.x, n.y - c.y, n.z - c.z);
    const sorted = ns.map(r).sort((a, b) => a - b);
    const cut = sorted[Math.floor(sorted.length * 0.93)] || Infinity;
    Graph.zoomToFit(ms, 45, n => n.x != null && r(n) <= cut);
  }

  // three.js sphere radius = cbrt(nodeVal) * nodeRelSize, so cube the radius we
  // actually want. Radius runs ~2.6 (leaf) to ~9.5 (main.js, degree 236).
  const nodeRadius = n => 2.6 + 6.9 * Math.sqrt(n.degree / maxDeg);

  const Graph = ForceGraph3D()(el)
    .backgroundColor('rgba(0,0,0,0)')          // let the CSS nebula show through
    .showNavInfo(false)
    .warmupTicks(120)                          // pre-bake a spread-out layout
    .cooldownTicks(420)
    .onEngineStop(() => { if (!fitted) { fitted = true; fitView(900); } })
    .nodeRelSize(1)
    .nodeResolution(14)
    .nodeOpacity(0.95)
    .nodeVal(n => Math.pow(nodeRadius(n), 3))
    .nodeColor(n => {
      if (!hlNodes.size) return nodeColor(n);
      return hlNodes.has(n.id) ? nodeColor(n) : 'rgba(70, 78, 105, 0.16)';
    })
    .linkCurvature(0.16)
    .linkWidth(l => (hlLinks.has(l) ? 1.8 : 0.55))
    .linkOpacity(0.44)
    .linkColor(l => {
      const c = CONF_COLORS[l.confidence] || [140, 140, 160];
      if (!hlNodes.size) {
        const a = 0.20 + 0.45 * (l.confidence_score || 0.5);
        return `rgba(${c[0]},${c[1]},${c[2]},${a.toFixed(2)})`;
      }
      return hlLinks.has(l) ? `rgba(${c[0]},${c[1]},${c[2]},0.95)` : 'rgba(60,68,95,0.05)';
    })
    .linkDirectionalParticles(l => (hlLinks.has(l) ? 3 : 0))
    .linkDirectionalParticleWidth(1.5)
    .linkDirectionalParticleSpeed(0.006)
    .onNodeHover(onHover)
    .onNodeClick(onClick)
    .onBackgroundClick(() => { select(null); })
    .graphData(visibleData());

  // 223 of these nodes sit in weakly-connected components with nothing pulling them
  // back toward the middle. Keeping charge short-range stops those islands from
  // repelling each other out to infinity and blowing up the zoom-to-fit box.
  Graph.d3Force('charge').strength(-58).distanceMax(190);
  Graph.d3Force('link').distance(l => 20 + 24 * (1 - (l.confidence_score || 0.5)));
  Graph.d3VelocityDecay(0.3);

  const camera = Graph.camera();
  const controls = Graph.controls();
  const Vector3 = camera.position.constructor;   // reuse the bundled three.js class

  // escape hatch for poking at the graph from the browser console
  window.graphify3d = { Graph, nodes, byId, adj };

  // ------------------------------------------------------------------ hover / select
  function computeHighlight(id) {
    hlNodes = new Set(); hlLinks = new Set();
    if (id == null) return;
    hlNodes.add(id);
    for (const nb of adj.get(id) || []) hlNodes.add(nb.id);
    for (const l of Graph.graphData().links) {
      const s = typeof l.source === 'object' ? l.source.id : l.source;
      const t = typeof l.target === 'object' ? l.target.id : l.target;
      if (s === id || t === id) hlLinks.add(l);
    }
  }
  function refreshPaint() {
    Graph.nodeColor(Graph.nodeColor())
         .linkColor(Graph.linkColor())
         .linkWidth(Graph.linkWidth())
         .linkDirectionalParticles(Graph.linkDirectionalParticles());
  }

  const tip = document.getElementById('tip');
  // Hover is label-only: it never touches hlNodes/hlLinks, so no dimming and no
  // particle flow. Tracing a node's connections is what clicking is for.
  function onHover(n) {
    state.hover = n ? n.id : null;
    el.style.cursor = n ? 'pointer' : null;
    if (n) {
      tip.style.display = 'block';
      tip.innerHTML = `<div>${esc(n.label)}</div>
        <div class="t2">${esc(COMM_LABELS[n.community] || 'cluster ' + n.community)} · ${n.degree} edges</div>`;
    } else tip.style.display = 'none';
  }
  window.addEventListener('mousemove', e => {
    if (tip.style.display !== 'block') return;
    tip.style.left = Math.min(e.clientX + 14, innerWidth - 310) + 'px';
    tip.style.top  = (e.clientY + 16) + 'px';
  });

  function onClick(n) { select(n.id); flyTo(n); }

  function flyTo(n) {
    const d = 150;
    const r = Math.hypot(n.x, n.y, n.z) || 1;
    Graph.cameraPosition(
      { x: n.x * (1 + d / r), y: n.y * (1 + d / r), z: n.z * (1 + d / r) },
      n, 900);
  }

  function select(id) {
    state.selected = id;
    computeHighlight(id); refreshPaint();
    const box = document.getElementById('detail');
    if (id == null) { box.classList.remove('show'); return; }
    const n = byId.get(id);
    box.classList.add('show');
    document.getElementById('d-label').textContent = n.label;
    const col = communityColor(n.community);
    document.getElementById('d-comm').innerHTML =
      `<span class="swatch" style="background:${col};color:${col}"></span>
       <span style="color:${col}">${esc(COMM_LABELS[n.community] || 'cluster ' + n.community)}</span>`;
    const loc = n.source_location ? ` <code>${esc(n.source_location)}</code>` : '';
    document.getElementById('d-meta').innerHTML =
      `${n.degree} connection${n.degree === 1 ? '' : 's'} · ${esc(n.file_type)} · via ${esc(n.origin)}<br>
       <code>${esc(n.source_file || '—')}</code>${loc}`;

    const nb = (adj.get(id) || []).slice().sort((a, b) => byId.get(b.id).degree - byId.get(a.id).degree);
    document.getElementById('d-nsec').textContent = `Connections (${nb.length})`;
    const host = document.getElementById('d-neighbors');
    host.innerHTML = '';
    for (const x of nb.slice(0, 60)) {
      const t = byId.get(x.id);
      const row = document.createElement('div');
      row.className = 'nh';
      const c = communityColor(t.community);
      row.innerHTML = `<span class="dot" style="background:${c}"></span>
        <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(t.label)}</span>
        <span class="rel">${esc(x.rel)}</span>`;
      row.onclick = () => { select(t.id); const live = Graph.graphData().nodes.find(v => v.id === t.id); if (live) flyTo(live); };
      host.appendChild(row);
    }
  }
  document.getElementById('d-close').onclick = () => select(null);

  // ------------------------------------------------------------------ labels overlay
  const labelHost = document.getElementById('labels');
  const pool = new Map();
  const fwd = new Vector3(), tmp = new Vector3();

  function tickLabels() {
    if (state.labelMode === 'none') {
      for (const [, d] of pool) d.style.display = 'none';
      return;
    }
    camera.getWorldDirection(fwd);
    // Fades are relative to how far the camera currently is, so labels behave the
    // same whether you're zoomed out on all 955 nodes or down inside one cluster.
    const camDist = camera.position.length() || 1;
    const budget = state.labelMode === 'all' ? 420 : 60;
    const seen = new Set();
    let drawn = 0;

    // Greedy screen-space collision culling. nodesByDeg is degree-descending, so
    // when two labels would overlap the more connected node keeps its label.
    const placed = [];
    const collides = (a, b, c, d) => placed.some(r => a < r[2] && c > r[0] && b < r[3] && d > r[1]);

    for (const n of nodesByDeg) {
      if (drawn >= budget) break;
      if (!visibleIds.has(n.id) || n.x == null) continue;

      const isHub = hubIds.has(n.id);
      const focused = n.id === state.selected || n.id === state.hover;
      if (state.labelMode !== 'all' && !isHub && !focused) continue;

      // cull anything behind the camera
      tmp.set(n.x - camera.position.x, n.y - camera.position.y, n.z - camera.position.z);
      if (tmp.dot(fwd) <= 0) continue;
      const dist = tmp.length();

      const p = Graph.graph2ScreenCoords(n.x, n.y, n.z);
      if (!p || p.x < -80 || p.y < -30 || p.x > innerWidth + 80 || p.y > innerHeight + 30) continue;

      // hubs and the focused node stay legible; the long tail fades with depth
      let op = (focused || isHub) ? 1
             : Math.max(0, Math.min(0.75, 1.3 - dist / (1.7 * camDist)));
      if (op < 0.08) continue;
      if (hlNodes.size && !hlNodes.has(n.id) && !focused) op *= 0.18;
      if (op < 0.05) continue;

      let d = pool.get(n.id);
      if (!d) {
        d = document.createElement('div');
        d.textContent = n.label;
        d.className = 'lbl' + (isHub ? ' hub' : '');
        labelHost.appendChild(d);
        d._w = d.offsetWidth;   // static text, so measure once at creation
        d._h = d.offsetHeight;
        pool.set(n.id, d);
      }

      const cx = p.x, cy = p.y - 8 - nodeRadius(n) * 0.9;
      const x1 = cx - d._w / 2, x2 = cx + d._w / 2;
      const y1 = cy - d._h / 2, y2 = cy + d._h / 2;
      if (!focused && collides(x1, y1, x2, y2)) continue;
      placed.push([x1, y1, x2, y2]);

      seen.add(n.id); drawn++;
      d.className = 'lbl' + (isHub ? ' hub' : '');
      d.style.display = 'block';
      d.style.opacity = op.toFixed(2);
      d.style.left = cx + 'px';
      d.style.top = cy + 'px';
    }
    for (const [id, d] of pool) if (!seen.has(id)) d.style.display = 'none';
  }

  (function loop() {
    if (state.spin) {
      // orbit the camera around the scene origin; controls.update() re-aims it
      const a = 0.0011;
      const x = camera.position.x, z = camera.position.z;
      camera.position.x = x * Math.cos(a) - z * Math.sin(a);
      camera.position.z = x * Math.sin(a) + z * Math.cos(a);
      controls.update();
    }
    tickLabels();
    requestAnimationFrame(loop);
  })();

  // ------------------------------------------------------------------ starfield
  (function stars() {
    const c = document.getElementById('stars'), g = c.getContext('2d');
    function draw() {
      const w = c.width = innerWidth, h = c.height = innerHeight;
      g.clearRect(0, 0, w, h);
      const n = Math.round(w * h / 5200);
      for (let i = 0; i < n; i++) {
        const x = Math.random() * w, y = Math.random() * h;
        const r = Math.random() < 0.9 ? Math.random() * 0.75 : 0.8 + Math.random() * 0.75;
        g.globalAlpha = 0.12 + Math.random() * 0.55;
        g.fillStyle = Math.random() < 0.85 ? '#cfd8ff' : '#9fe8ff';
        g.beginPath(); g.arc(x, y, r, 0, 6.2832); g.fill();
      }
      g.globalAlpha = 1;
    }
    draw();
    addEventListener('resize', draw);
  })();

  // ------------------------------------------------------------------ chrome wiring
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g,
    m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));

  function refreshStats() {
    const gd = Graph.graphData();
    document.getElementById('s-nodes').textContent = gd.nodes.length;
    document.getElementById('s-links').textContent = gd.links.length;
    document.getElementById('s-comm').textContent = commOrder.length - state.hiddenComms.size;
  }

  function rebuild() {
    const keepSel = state.selected;
    Graph.graphData(visibleData());
    if (keepSel && !byId.has(keepSel)) select(null);
    computeHighlight(state.selected); refreshPaint(); refreshStats();
  }

  // color-by
  document.querySelectorAll('#seg-color button').forEach(b => b.onclick = () => {
    document.querySelectorAll('#seg-color button').forEach(x => x.classList.remove('on'));
    b.classList.add('on'); state.colorBy = b.dataset.v; refreshPaint();
  });
  // labels
  document.querySelectorAll('#seg-labels button').forEach(b => b.onclick = () => {
    document.querySelectorAll('#seg-labels button').forEach(x => x.classList.remove('on'));
    b.classList.add('on'); state.labelMode = b.dataset.v;
  });
  // confidence filters
  document.querySelectorAll('#conf-filters input').forEach(cb => cb.onchange = () => {
    state.conf[cb.dataset.c] = cb.checked; rebuild();
  });
  // buttons
  document.getElementById('btn-reheat').onclick = () => { fitted = false; Graph.d3ReheatSimulation(); };
  document.getElementById('btn-spin').onclick = e => {
    state.spin = !state.spin; e.target.style.color = state.spin ? 'var(--accent)' : '';
  };
  document.getElementById('btn-reset').onclick = () => {
    select(null); fitView(900);
  };

  // legend
  const legBody = document.getElementById('legend-body');
  for (const [cid, count] of commOrder) {
    const row = document.createElement('div');
    row.className = 'leg';
    const c = communityColor(cid);
    row.innerHTML = `<span class="swatch" style="background:${c};color:${c}"></span>
      <span class="name">${esc(COMM_LABELS[cid] || 'cluster ' + cid)}</span>
      <span class="n">${count}</span>`;
    row.onclick = () => {
      if (state.hiddenComms.has(cid)) { state.hiddenComms.delete(cid); row.classList.remove('off'); }
      else { state.hiddenComms.add(cid); row.classList.add('off'); }
      rebuild();
    };
    legBody.appendChild(row);
  }
  document.getElementById('leg-all').onclick = () => {
    state.hiddenComms.clear();
    document.querySelectorAll('.leg').forEach(r => r.classList.remove('off'));
    rebuild();
  };

  // search
  const search = document.getElementById('search'), results = document.getElementById('results');
  search.oninput = () => {
    const q = search.value.trim().toLowerCase();
    if (!q) { results.style.display = 'none'; return; }
    const hits = nodes
      .filter(n => n.label.toLowerCase().includes(q) || (n.source_file || '').toLowerCase().includes(q))
      .sort((a, b) => b.degree - a.degree).slice(0, 40);
    results.innerHTML = '';
    for (const n of hits) {
      const d = document.createElement('div');
      d.className = 'hit';
      d.innerHTML = `<span class="dot" style="background:${communityColor(n.community)}"></span>
        <span style="overflow:hidden;text-overflow:ellipsis">${esc(n.label)}</span>
        <span class="meta">${n.degree}</span>`;
      d.onclick = () => {
        if (state.hiddenComms.has(n.community)) { state.hiddenComms.delete(n.community); rebuild(); }
        select(n.id);
        const live = Graph.graphData().nodes.find(v => v.id === n.id);
        if (live) flyTo(live);
        results.style.display = 'none'; search.value = '';
      };
      results.appendChild(d);
    }
    results.style.display = hits.length ? 'block' : 'none';
  };

  addEventListener('keydown', e => {
    if (e.key === 'Escape') { select(null); results.style.display = 'none'; search.blur(); }
    if (e.key === '/' && document.activeElement !== search) { e.preventDefault(); search.focus(); }
  });
  addEventListener('resize', () => Graph.width(innerWidth).height(innerHeight));

  refreshStats();
  Graph.cameraPosition({ x: 0, y: 0, z: 900 });
  // onEngineStop does the real fit; this is the belt-and-braces fallback in case
  // the simulation is still cooling when the user first looks at it.
  setTimeout(() => { if (!fitted) { fitted = true; fitView(900); } }, 6000);
  setTimeout(() => { const h = document.getElementById('hint'); h.style.opacity = 0; }, 7000);
})();
</script>
</body>
</html>
