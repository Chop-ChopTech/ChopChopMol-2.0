# Deploy the dev branch to the chopchopmol-dev Firebase project.
#
# As of b82ebfc (Migrate dev frontend Firebase Hosting → AWS S3 + CloudFront),
# dev.chopchopmol.com points at CloudFront, not Firebase. This workflow is
# retained as a manual rollback path only — it no longer fires on push to
# avoid double-deploying every change. Trigger via the Actions tab when you
# need to flip back to chopchopmoldev.web.app (see CHANGELOG.md rollback
# runbook).
name: Deploy to Firebase Hosting (dev — manual rollback only)

on:
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install demo deps
        working-directory: ./demo
        run: npm ci

      - name: Deploy to chopchopmol-dev
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CHOPCHOPMOL_DEV }}
          channelId: live
          projectId: chopchopmoldev
          entryPoint: ./demo
