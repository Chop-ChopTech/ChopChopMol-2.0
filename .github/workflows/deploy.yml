name: Test and Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Wake up Render backend
        run: |
          curl -s https://chopchopmol-ai-backend.onrender.com/health || true
          sleep 30
      
      - name: Run AI tests
        run: node tests/ai-tests.js
        env:
          BACKEND_URL: https://chopchopmol-ai-backend.onrender.com