<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChopChopMol 2.0</title>
    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<body>
    <script type="module">
        // Import the functions you need from the SDKs you need
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-analytics.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";
        // TODO: Add SDKs for Firebase products that you want to use
        // https://firebase.google.com/docs/web/setup#available-libraries

        // Your web app's Firebase configuration
        // For Firebase JS SDK v7.20.0 and later, measurementId is optional
        const firebaseConfig = {
            apiKey: "AIzaSyAAlbmJmNxVGJ3wv1KiyoFWJ86Ik31jY-w",
            authDomain: "chopchopmol-2.firebaseapp.com",
            projectId: "chopchopmol-2",
            storageBucket: "chopchopmol-2.firebasestorage.app",
            messagingSenderId: "911400525967",
            appId: "1:911400525967:web:1e3e6bfefdcb8edc8ad0fa",
            measurementId: "G-9T7NPR755W"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const analytics = getAnalytics(app);
        const auth = getAuth(app);  // Initialize Auth
        const provider = new GoogleAuthProvider();  // For Google sign-in


        // Get UI elements
        const signInButton = document.getElementById('signInButton');
        const signOutButton = document.getElementById('signOutButton');
        const userStatus = document.getElementById('userStatus');

        // Handle sign-in
        signInButton.addEventListener('click', () => {
            signInWithPopup(auth, provider)
                .then((result) => {
                    const user = result.user;
                    console.log('Signed in as', user.displayName);
                })
                .catch((error) => {
                    console.error('Sign-in error:', error);
                });
        });

        // Handle sign-out
        signOutButton.addEventListener('click', () => {
            signOut(auth)
                .then(() => {
                    console.log('Signed out');
                })
                .catch((error) => {
                    console.error('Sign-out error:', error);
                });
        });

        // Listen for auth state changes and update UI
        onAuthStateChanged(auth, (user) => {
            if (user) {
                // User is signed in
                signInButton.style.display = 'none';
                signOutButton.style.display = 'block';
                userStatus.style.display = 'block';
                userStatus.textContent = `Signed in as ${user.displayName}`;
            } else {
                // User is signed out
                signInButton.style.display = 'block';
                signOutButton.style.display = 'none';
                userStatus.style.display = 'none';
                userStatus.textContent = '';
            }
        });
    </script>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- Buttons with new toggle labels button -->
    <div id="buttons">
        <input id="fileInput" type="file" accept=".xyz, .mol, .pdb" style="display: none;">
        <input id="compare" type="file" accept=".xyz, .mol, .pdb" style="display: none;">
        <div class="dropdown">
            <span class="dropdown-icon"><i class="fa-solid fa-file-arrow-up"></i>
            </span>
            <div class="dropdown-content" style="left: 50%;">
                <button class="fancy-button" id="aiGenerate"><i class="fa-solid fa-wand-magic-sparkles"></i> AI
                    Generate</button>
                <button class="fancy-button" id="customButton"><i class="fa-solid fa-bolt"></i> Open File</button>
                <button class="fancy-button" id="import-smiles"><i class="fas fa-vial"></i> Load SMILES string</button>
                <button class="fancy-button" id="import-json"><i class="fas fa-file-code"></i><br> Load JSON
                    <button class="fancy-button" id="compareButton">Compare</button>

            </div>
        </div>
        <div class="dropdown">
            <span class="dropdown-icon" style="left: 50%;"><i class="fas fa-chart-bar"></i></span>
            <div class="dropdown-content">
                <button class="fancy-button" id="switchMode"><i class="fas fa-paint-brush"></i> Toggle Style</button>
                <button class="fancy-button" id="captureScreen"><i class="fas fa-camera"></i> Save Image</button>
                <button class="fancy-button" id="analyze-molecule">Analyze molecule</button>
                <button class="fancy-button" id="editMolecule"> <i class="fas fa-edit"></i> Edit Molecule</button>
                <button class="fancy-button" id="clear-canvas"><i class="fa-solid fa-trash"></i> Clear</button>


            </div>
        </div>
        <div class="dropdown" id="settings">
            <span class="dropdown-icon"><i class="fa-solid fa-gear"></i></span>
            <div class="dropdown-content" style="left: 100px;">

                <button class="fancy-button" id="signInButton"><i class="fas fa-sign-in-alt"></i> Sign In with
                    Google</button>
                <button class="fancy-button" id="signOutButton" style="display: none;"><i
                        class="fas fa-sign-out-alt"></i> Sign Out</button>
            </div>
        </div>



    </div>

    <!-- Add this below #buttons to show user info -->
    <div id="userStatus" style="color: white;"></div>
    <div id="styleSelector" class="on">

        <div class="switch-container">
            <span class="switch-label">Toggle Style Changes</span>
            <label class="switch">
                <input type="checkbox" id="toggleStyleChanges">
                <span class="slider"></span>
            </label>
            <br>
        </div>

        <br>

        <label for="style1">Roughness</label>
        <input type="range" id="style1" min="0" max="1" step="0.01" , value="0.17">

        <label for="style2">Metalness</label>
        <input type="range" id="style2" min="0" max="1" step="0.01" value="0.3">

        <label for="style3">Opacity</label>
        <input type="range" id="style3" min="0" max="1" step="0.01" value="1">

        <label for="style4">Bonds</label>
        <input type="range" id="style4">

        <label for="style5">Atom Size</label>
        <input type="range" id="style5" min="0.1" max="2" step="0.01">

        <label for="style6">Resolution</label>
        <input type="range" id="style6" min="1" max="64" step="1">

        <label for="style8">Background Color</label>
        <input type="color" id="style8" value="#ff0000">

        <div>
            <input type="checkbox" id="style7">
            <span>Toggle Antialising</span>
        </div>
        <div>
            <input type="checkbox" id="toggleLabels"></button>
            <span>Toggle Atom labels</span>
        </div>


    </div>
    <div id="dragFile">
        <h3>Drag and drop a file here .xyz, .mol, or .pdb to be loaded</h3>
    </div>

    <div id="editMoleculePanel" class="on">
        <div id="editMoleculeContent">
            <h2 id="select-an-atom">Select an atom<h2>
        </div>
    </div>


    <h1 id="loading">Loading Molecule</h1>
    <div id="analysisResponseContainer">
        <button onclick="closeAnalysisWindow()" id="closeAnalysis" class="fancy-button">Close</button>
        <canvas id="explorationCanvas" class="on"></canvas>
    </div>
    <script src="effects.js"></script>


    <!-- Chat interface -->
    <div id="chatContainer" class="fancy-input-container" style="margin-top: 20px; padding: 10px;">
        <!-- <h3>Generate a molecule with AI!</h2> -->
        <div id="chatInputContainer">
            <input id="chatInput" class="fancy-textbox" type="text"
                placeholder="Type a real or made up molecule name and press enter or click Generate!"
                autocomplete="off">
            <button onclick="sendChatMessage()" id="generateButton" class="fancy-button">Generate!</button>
        </div>
        <!-- <br>
        <div id="chatOutput" style="margin-top: 10px; max-width: 400px;"></div> -->
    </div>
    <div id="smilesContainer" class="fancy-input-container" style="margin-top: 20px; padding: 10px;">
        <!-- <h3>Generate a molecule with AI!</h2> -->
        <div id="smilesInputContainer">
            <input id="smilesInput" class="fancy-textbox" type="text"
                placeholder="Type your SMILES string and press enter or click Load!" autocomplete="off">
            <button onclick="convertToJson()" class="fancy-button" id="loadSmilesButton">Load</button>
        </div>
        <!-- <br>
        <div id="chatOutput" style="margin-top: 10px; max-width: 400px;"></div> -->
    </div>
    <div id="jsonContainer" class="fancy-input-container" style="margin-top: 20px; padding: 10px;">
        <!-- <h3>Generate a molecule with AI!</h2> -->
        <div id="jsonInputContainer">
            <input id="jsonInput" class="fancy-textbox" type="text"
                placeholder="Type your JSON string and press enter or click Load!" autocomplete="off">
            <button onclick="sendChatMessage()" class="fancy-button" id="loadJsonButton"
                class="fancy-button">Load</button>
        </div>
        <!-- <br>
        <div id="chatOutput" style="margin-top: 10px; max-width: 400px;"></div> -->
    </div>

    <!-- Scripts -->
    <script src="utils/utils.js"></script>
    <script>
        const fileInput = document.getElementById('fileInput');
        const customButton = document.getElementById('customButton');

        customButton.addEventListener('click', () => {
            fileInput.click();
        });
        const compareFileInput = document.getElementById('compare');
        const compareButton = document.getElementById('compareButton');

        compareButton.addEventListener('click', () => {
            compareFileInput.click();
        });
    </script>
    <script>
        let _reply = null;
        let _reply2 = "hhhh";

        const chatBox = document.getElementById('chatInput');
        const smilesBox = document.getElementById('smilesInput');
        const jsonBox = document.getElementById('jsonInput');
        const loadingText = document.getElementById('loading');

        Object.defineProperty(window, 'reply', {
            get: function () { return _reply; },
            set: function (value) {
                _reply = value;
                console.log('New molecule updated:', value);
                window.dispatchEvent(new CustomEvent('replyUpdated', { detail: value }));
            }
        });
        Object.defineProperty(window, 'imgToAnalyze', {
            get: function () { return _reply2; },
            set: function (value) {
                _reply2 = value;
                console.log('Analyzed image:', value);
                window.dispatchEvent(new CustomEvent('analyzeImage', { detail: value }));
            }
        });


        const aiGeneratePanel = document.getElementById('chatContainer');
        const aiGenerateButton = document.getElementById('aiGenerate');
        const smilesButton = document.getElementById('import-smiles');
        const smilesPanel = document.getElementById('smilesContainer');
        const jsonButton = document.getElementById('import-json');
        const jsonPanel = document.getElementById('jsonContainer');
        const dropZone = document.getElementById('dragFile');
        jsonButton.addEventListener('click', () => {
            jsonPanel.classList.toggle('on');
            smilesPanel.classList.remove('on');
            aiGeneratePanel.classList.remove('on');
        })
        aiGenerateButton.addEventListener('click', () => {
            aiGeneratePanel.classList.toggle('on');
            smilesPanel.classList.remove('on');
            jsonPanel.classList.remove('on');
        });

        smilesButton.addEventListener('click', () => {
            // aiGeneratePanel.style.display = aiGeneratePanel.style.display === 'none' ? 'flex' : 'none'; 
            smilesPanel.classList.toggle('on');
            aiGeneratePanel.classList.remove('on');
            jsonPanel.classList.remove('on');
        });


        let enterPressed = false;

        chatBox.addEventListener('keydown', (event) => {
            if (event.key === 'Enter' && !enterPressed) {
                enterPressed = true;
                sendChatMessage();
            }
        });

        chatBox.addEventListener('keyup', (event) => {
            if (event.key === 'Enter') {
                enterPressed = false;
            }
        });
        smilesBox.addEventListener('keydown', (event) => {
            if (event.key === 'Enter' && !enterPressed) {
                enterPressed = true;
                convertToJson();
            }
        });

        smilesBox.addEventListener('keyup', (event) => {
            if (event.key === 'Enter') {
                enterPressed = false;
            }
        });
        jsonBox.addEventListener('keydown', (event) => {
            if (event.key === 'Enter' && !enterPressed) {
                enterPressed = true;
                loadJson();
            }
        });

        jsonBox.addEventListener('keyup', (event) => {
            if (event.key === 'Enter') {
                enterPressed = false;
            }
        });

        dropZone.addEventListener('dragover', (event) => {
            event.preventDefault(); // Prevent default to allow drop
            dropZone.classList.add('dragOver');
        });

        dropZone.addEventListener('dragenter', (event) => {
            event.preventDefault();
            dropZone.classList.add('dragOver');
        });

        dropZone.addEventListener('dragleave', () => {
            dropZone.classList.remove('dragOver');
        });

        async function sendChatMessage() {
            const chatInput = chatBox.value;

            //const chatOutput = document.getElementById('chatOutput');
            if (!chatInput) return;
            aiGeneratePanel.classList.remove('on');
            loadingText.classList.add('on');
            //chatOutput.innerHTML += `<p id="loading" class="typewriter"><strong>Generating Molecule...</p>`;

            try {
                const response = await fetch('https://chopchopmol-2-0-3.onrender.com/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: chatInput })
                });
                const data = await response.json();

                window.reply = data.reply;
                document.getElementById('chatInput').value = '';
                chatOutput.scrollTop = chatOutput.scrollHeight;
                loadingText.classList.remove('on');
            } catch (error) {
                //chatOutput.innerHTML += `<p><strong>Error:</strong> Network issue</p>`;
                loadingText.classList.remove('on');

            }

        }
        async function convertToJson() {
            const chatInput = document.getElementById('smilesInput').value;
            console.log(chatInput);
            if (!chatInput) return;
            smilesPanel.classList.remove('on');

            try {
                const response = await fetch('https://chopchopmol-2-0-3.onrender.com/tosmiles', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: chatInput })
                });
                const data = await response.json();
                console.log(data);
                window.reply = data.reply;

            } catch (error) {
                //chatOutput.innerHTML += `<p><strong>Error:</strong> Network issue</p>`;
            }
        }
        async function analyzeMolecule(data) {
            const chatInputImg = data.images;
            const chatInputCoordinates = data.coordinates;
            const aiAnalyzePanel = document.getElementById('analysisResponseContainer');
            const loading = document.getElementById('explorationCanvas');
            //const chatOutput = document.getElementById('chatOutput');
            if (!chatInputImg) return;
            //chatOutput.innerHTML += `<p id="loading" class="typewriter"><strong>Generating Molecule...</p>`;
            loading.classList.add('on');
            try {
                const response = await fetch('https://chopchopmol-2-0-3.onrender.com/analysis', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: chatInputImg, coordinates: chatInputCoordinates })
                });
                const data = await response.json();

                window.imgToAnalyze = data.reply;

                const reply = marked.parse(data.reply);

                const text = document.createElement('p');

                text.innerHTML = reply;
                aiAnalyzePanel.appendChild(text);
                loading.classList.remove('on');
            } catch (error) {
                //chatOutput.innerHTML += `<p><strong>Error:</strong> Network issue</p>`;
                loadingText.classList.remove('on');
            }
        }
        function loadJson() {
            jsonPanel.classList.remove('on');
            window.reply = document.getElementById('jsonInput').value;
        }
        window.addEventListener('analyzeImage', (event) => {
            const newReply = event.detail;
            console.log(newReply);
            analyzeMolecule(event.detail);

        });
        function closeAnalysisWindow() {
            document.getElementById('analysisResponseContainer').classList.remove('on');
        }
        document.querySelectorAll('.fancy-button').forEach(button => {
            button.addEventListener('click', (e) => {
                const rect = button.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                button.style.setProperty('--ripple-x', `${x}px`);
                button.style.setProperty('--ripple-y', `${y}px`);
            });
        });

    </script>
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@v0.171.0/build/three.module.js",
                "jsm/": "https://cdn.jsdelivr.net/npm/three@0.171.0/examples/jsm/"
            }

    </script>
    <pre id="output"></pre>
    <script type="module" src="main.js"></script>
