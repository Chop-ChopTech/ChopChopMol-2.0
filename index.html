<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChopChopMol 2.0</title>
    <link rel="stylesheet" href="style.css">
    <!-- <link rel="icon" href="logo.png"> -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@300..700&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">
</head>

<body>
    <!-- Buttons with new toggle labels button -->
    <div id="buttons">
        <input id="fileInput" type="file" accept=".xyz, .mol, .pdb" style="display: none;">
        <button class="fancy-button" id="aiGenerate" class="button">AI Generate BETA</button>

        <button class="fancy-button" id="customButton">Open File</button>
        <button class="fancy-button" id="switchMode" class="button">Toggle Style</button>
        <button class="fancy-button" id="toggleLabels" class="button">Atom Labels</button>
        <button class="fancy-button" id="captureScreen" class="button">Save Image</button>
        <button class="fancy-button" id="compare" class="button">compare</button>
        <button class="fancy-button" id="import-smiles" class="button">Load SMILES string</button>
        <button class="fancy-button" id="import-json" class="button">Load JSON string</button>
    </div>
    <h1 id="loading">Loading Molecule</h1>

    <!-- Chat interface -->
    <div id="chatContainer" class="fancy-input-container" style="margin-top: 20px; padding: 10px;">
        <!-- <h3>Generate a molecule with AI!</h2> -->
        <div id="chatInputContainer">
            <input id="chatInput" class="fancy-textbox" type="text"
                placeholder="Type a real or made up molecule name and press enter or click Generate!"
                autocomplete="off">
            <button onclick="sendChatMessage()" class="button, fancy-button" id="generateButton"
                class="fancy-button">Generate!</button>
        </div>
        <!-- <br>
        <div id="chatOutput" style="margin-top: 10px; max-width: 400px;"></div> -->
    </div>
    <div id="smilesContainer" class="fancy-input-container" style="margin-top: 20px; padding: 10px;">
        <!-- <h3>Generate a molecule with AI!</h2> -->
        <div id="smilesInputContainer">
            <input id="smilesInput" class="fancy-textbox" type="text"
                placeholder="Type your SMILES string and press enter or click Load!" autocomplete="off">
            <button onclick="convertToJson()" class="button, fancy-button" id="loadSmilesButton">Load</button>
        </div>
        <!-- <br>
        <div id="chatOutput" style="margin-top: 10px; max-width: 400px;"></div> -->
    </div>
    <div id="jsonContainer" class="fancy-input-container" style="margin-top: 20px; padding: 10px;">
        <!-- <h3>Generate a molecule with AI!</h2> -->
        <div id="jsonInputContainer">
            <input id="jsonInput" class="fancy-textbox" type="text"
                placeholder="Type your JSON string and press enter or click Load!" autocomplete="off">
            <button onclick="sendChatMessage()" class="button, fancy-button" id="loadJsonButton"
                class="fancy-button">Load</button>
        </div>
        <!-- <br>
        <div id="chatOutput" style="margin-top: 10px; max-width: 400px;"></div> -->
    </div>

    <!-- Scripts -->
    <script src="utils/utils.js"></script>
    <script>
        const fileInput = document.getElementById('fileInput');
        const customButton = document.getElementById('customButton');

        customButton.addEventListener('click', () => {
            fileInput.click();
        });

        fileInput.addEventListener('change', (event) => {
            if (event.target.files.length > 0) {
                customButton.textContent = `Selected: ${event.target.files[0].name}`;
            }
        });
    </script>
    <script>
        let _reply = null;
        const chatBox = document.getElementById('chatInput');
        const smilesBox = document.getElementById('smilesInput');
        const jsonBox = document.getElementById('jsonInput');
        const loadingText = document.getElementById('loading');
        Object.defineProperty(window, 'reply', {
            get: function () { return _reply; },
            set: function (value) {
                _reply = value;
                console.log('[Atomix] reply updated:', value);
                window.dispatchEvent(new CustomEvent('replyUpdated', { detail: value }));
            }
        });

        const aiGeneratePanel = document.getElementById('chatContainer');
        const aiGenerateButton = document.getElementById('aiGenerate');
        const smilesButton = document.getElementById('import-smiles');
        const smilesPanel = document.getElementById('smilesContainer');
        const jsonButton = document.getElementById('import-json');
        const jsonPanel = document.getElementById('jsonContainer');
        jsonButton.addEventListener('click', () => {
            jsonPanel.classList.toggle('on');
            smilesPanel.classList.remove('on');
            aiGeneratePanel.classList.remove('on');
        })
        aiGenerateButton.addEventListener('click', () => {
            aiGeneratePanel.classList.toggle('on');
            smilesPanel.classList.remove('on');
            jsonPanel.classList.remove('on');
        });

        smilesButton.addEventListener('click', () => {
            // aiGeneratePanel.style.display = aiGeneratePanel.style.display === 'none' ? 'flex' : 'none'; 
            smilesPanel.classList.toggle('on');
            aiGeneratePanel.classList.remove('on');
            jsonPanel.classList.remove('on');
        });

        let enterPressed = false;

        chatBox.addEventListener('keydown', (event) => {
            if (event.key === 'Enter' && !enterPressed) {
                enterPressed = true;
                sendChatMessage();
            }
        });

        chatBox.addEventListener('keyup', (event) => {
            if (event.key === 'Enter') {
                enterPressed = false;
            }
        });
        smilesBox.addEventListener('keydown', (event) => {
            if (event.key === 'Enter' && !enterPressed) {
                enterPressed = true;
                convertToJson();
            }
        });

        smilesBox.addEventListener('keyup', (event) => {
            if (event.key === 'Enter') {
                enterPressed = false;
            }
        });
        jsonBox.addEventListener('keydown', (event) => {
            if (event.key === 'Enter' && !enterPressed) {
                enterPressed = true;
                loadJson();
            }
        });

        jsonBox.addEventListener('keyup', (event) => {
            if (event.key === 'Enter') {
                enterPressed = false;
            }
        });

        async function sendChatMessage() {
            const chatInput = chatBox.value;

            //const chatOutput = document.getElementById('chatOutput');
            if (!chatInput) return;
            aiGeneratePanel.classList.remove('on');
            loadingText.classList.add('on');
            //chatOutput.innerHTML += `<p id="loading" class="typewriter"><strong>Generating Molecule...</p>`;

            try {
                const response = await fetch('https://chopchopmol-2-0-3.onrender.com/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: chatInput })
                });
                const data = await response.json();

                window.reply = data.reply;
                document.getElementById('chatInput').value = '';
                chatOutput.scrollTop = chatOutput.scrollHeight;
                loadingText.classList.remove('on');
            } catch (error) {
                //chatOutput.innerHTML += `<p><strong>Error:</strong> Network issue</p>`;
                loadingText.classList.remove('on');

            }

        }
        async function convertToJson() {
            const chatInput = document.getElementById('smilesInput').value;
            console.log(chatInput);
            if (!chatInput) return;
            smilesPanel.classList.remove('on');

            try {
                const response = await fetch('https://chopchopmol-2-0-3.onrender.com/tosmiles', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: chatInput })
                });
                const data = await response.json();
                console.log(data);
                window.reply = data.reply;

            } catch (error) {
                //chatOutput.innerHTML += `<p><strong>Error:</strong> Network issue</p>`;
            }
        }
        function loadJson() {
            jsonPanel.classList.remove('on');
            window.reply = document.getElementById('jsonInput').value;
        }



    </script>
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@v0.171.0/build/three.module.js",
                "jsm/": "https://cdn.jsdelivr.net/npm/three@0.171.0/examples/jsm/"
            }
        }
    </script>
    <pre id="output"></pre>
    <script type="module" src="main.js"></script>
</body>

</html>
