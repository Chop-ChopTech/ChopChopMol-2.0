<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Request Early Access · ChopChopMol</title>
    <link rel="icon" href="/demo/molicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,300..900;1,300..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: 'Rubik', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #07080f;
            color: #d4d8e0;
            min-height: 100vh;
            line-height: 1.6;
        }
        .wrap {
            max-width: 540px;
            margin: 0 auto;
            padding: 64px 24px 80px;
        }
        h1 {
            font-size: 28px;
            margin: 0 0 8px;
            color: #e8eaf0;
            font-weight: 600;
            letter-spacing: -0.01em;
        }
        p.lede { color: #8b93a3; margin: 0 0 28px; font-size: 14px; }
        label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            margin: 14px 0 6px;
            color: #aab1bf;
        }
        input, textarea {
            width: 100%;
            padding: 11px 14px;
            font: inherit;
            font-size: 14px;
            color: #d4d8e0;
            background: #11131c;
            border: 1px solid #232735;
            border-radius: 6px;
            outline: none;
            transition: border-color 0.15s;
        }
        input:focus, textarea:focus { border-color: #3b4a6b; }
        textarea { resize: vertical; min-height: 96px; }
        button {
            margin-top: 22px;
            width: 100%;
            padding: 12px 20px;
            font: inherit;
            font-size: 14px;
            font-weight: 500;
            color: #fff;
            background: #1d60fd;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.15s;
        }
        button:hover { background: #1850d8; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .msg {
            margin-top: 18px;
            padding: 12px 14px;
            border-radius: 6px;
            font-size: 13px;
        }
        .msg.ok    { background: #0f2418; border: 1px solid #1f4a30; color: #86d8a4; }
        .msg.err   { background: #2a1416; border: 1px solid #5a2326; color: #e89090; }
        .footer { margin-top: 24px; font-size: 13px; color: #6b7280; text-align: center; }
        .footer a { color: #6b8cf0; text-decoration: none; }
    </style>
</head>

<body>
    <div class="wrap">
        <h1>Request Early Access</h1>
        <p class="lede">ChopChopMol is in private beta. Tell us a bit about yourself and we'll get back to you shortly.</p>

        <form id="form">
            <label for="email">Email *</label>
            <input id="email" name="email" type="email" required autocomplete="email">

            <label for="name">Name *</label>
            <input id="name" name="name" type="text" required autocomplete="name">

            <label for="org">Organization</label>
            <input id="org" name="org" type="text" autocomplete="organization">

            <label for="useCase">What do you want to use ChopChopMol for? *</label>
            <textarea id="useCase" name="useCase" required></textarea>

            <button type="submit" id="submitBtn">Request access</button>
        </form>

        <div id="message" class="msg" style="display:none"></div>

        <div class="footer">Already approved? <a href="/demo/index.html">Sign in</a></div>
    </div>

    <script type="module">
        import { getBackendUrl } from '/demo/utils/apiUtils.js';

        const form = document.getElementById('form');
        const msg = document.getElementById('message');
        const btn = document.getElementById('submitBtn');

        function show(kind, text) {
            msg.className = 'msg ' + kind;
            msg.textContent = text;
            msg.style.display = 'block';
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            msg.style.display = 'none';
            btn.disabled = true;
            btn.textContent = 'Sending…';

            const payload = {
                email: form.email.value.trim(),
                name: form.name.value.trim(),
                org: form.org.value.trim(),
                useCase: form.useCase.value.trim(),
            };

            try {
                const url = await getBackendUrl();
                const res = await fetch(`${url}/access/request`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload),
                });
                const data = await res.json().catch(() => ({}));
                if (!res.ok) {
                    show('err', data.error || `Submit failed (${res.status})`);
                } else {
                    form.style.display = 'none';
                    show('ok', "Thanks — your request is in. We'll email you when it's reviewed.");
                }
            } catch (err) {
                show('err', err.message || 'Network error');
            } finally {
                btn.disabled = false;
                btn.textContent = 'Request access';
            }
        });
    </script>
</body>
</html>
