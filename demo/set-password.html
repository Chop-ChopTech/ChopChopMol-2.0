<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set Your Password · ChopChopMol</title>
    <link rel="icon" href="/demo/molicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,300..900;1,300..900&display=swap"
        rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: 'Rubik', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #07080f;
            color: #d4d8e0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .card {
            background: #0f1119;
            border: 1px solid #1c2030;
            border-radius: 10px;
            padding: 36px 32px;
            max-width: 420px;
            width: 100%;
        }
        h1 {
            font-size: 22px;
            margin: 0 0 6px;
            color: #e8eaf0;
            font-weight: 600;
        }
        p.lede { color: #8b93a3; margin: 0 0 22px; font-size: 13px; }
        label { display: block; font-size: 13px; font-weight: 500; margin: 12px 0 6px; color: #aab1bf; }
        input {
            width: 100%;
            padding: 11px 14px;
            font: inherit;
            font-size: 14px;
            color: #d4d8e0;
            background: #11131c;
            border: 1px solid #232735;
            border-radius: 6px;
            outline: none;
        }
        input:focus { border-color: #2d8fa5; }
        button {
            margin-top: 22px;
            width: 100%;
            padding: 12px 20px;
            font: inherit;
            font-size: 14px;
            font-weight: 500;
            color: #fff;
            background: #2d8fa5;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.15s;
        }
        button:hover { background: #25788c; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .msg { margin-top: 14px; font-size: 13px; padding: 10px 12px; border-radius: 6px; }
        .msg.ok  { background: #0f2418; border: 1px solid #1f4a30; color: #86d8a4; }
        .msg.err { background: #2a1416; border: 1px solid #5a2326; color: #e89090; }
        .email-hint { font-size: 13px; color: #6b7280; margin: 0 0 6px; }
    </style>
</head>

<body>
    <div class="card">
        <h1>Set your password</h1>
        <p class="lede" id="lede">Validating your link…</p>

        <form id="form" style="display:none">
            <p class="email-hint" id="emailHint"></p>
            <label for="pw">New password (8+ characters)</label>
            <input id="pw" type="password" minlength="8" required autocomplete="new-password">

            <label for="pw2">Confirm password</label>
            <input id="pw2" type="password" minlength="8" required autocomplete="new-password">

            <button type="submit" id="submitBtn">Set password &amp; sign in</button>
        </form>

        <div id="message" class="msg" style="display:none"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";
        import {
            getAuth, verifyPasswordResetCode, confirmPasswordReset, signInWithEmailAndPassword
        } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAAlbmJmNxVGJ3wv1KiyoFWJ86Ik31jY-w",
            authDomain: "chopchopmol-2.firebaseapp.com",
            projectId: "chopchopmol-2",
            storageBucket: "chopchopmol-2.firebasestorage.app",
            messagingSenderId: "911400525967",
            appId: "1:911400525967:web:1e3e6bfefdcb8edc8ad0fa",
        };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        const lede = document.getElementById('lede');
        const form = document.getElementById('form');
        const emailHint = document.getElementById('emailHint');
        const msg = document.getElementById('message');
        const btn = document.getElementById('submitBtn');

        const params = new URLSearchParams(location.search);
        const oobCode = params.get('oobCode');
        // Firebase appends mode=resetPassword to the link; we don't strictly need it.

        function show(kind, text) {
            msg.className = 'msg ' + kind;
            msg.textContent = text;
            msg.style.display = 'block';
        }

        let userEmail = null;
        if (!oobCode) {
            lede.textContent = 'This link is missing its setup code.';
            show('err', 'Use the link from your email exactly as sent. If it has expired, request a new one.');
        } else {
            verifyPasswordResetCode(auth, oobCode)
                .then((email) => {
                    userEmail = email;
                    lede.textContent = "Pick a password to finish setting up your account.";
                    emailHint.textContent = `For ${email}`;
                    form.style.display = 'block';
                })
                .catch((err) => {
                    lede.textContent = 'This link is invalid or has expired.';
                    show('err', err.message || 'Please request a new link.');
                });
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            msg.style.display = 'none';
            const pw = document.getElementById('pw').value;
            const pw2 = document.getElementById('pw2').value;
            if (pw !== pw2) { show('err', 'Passwords do not match.'); return; }
            btn.disabled = true;
            btn.textContent = 'Working…';

            try {
                await confirmPasswordReset(auth, oobCode, pw);
                if (userEmail) {
                    await signInWithEmailAndPassword(auth, userEmail, pw);
                }
                show('ok', 'Done. Redirecting to the app…');
                setTimeout(() => { location.href = '/demo/index.html'; }, 900);
            } catch (err) {
                show('err', err.message || 'Could not set password.');
                btn.disabled = false;
                btn.textContent = 'Set password & sign in';
            }
        });
    </script>
</body>
</html>
